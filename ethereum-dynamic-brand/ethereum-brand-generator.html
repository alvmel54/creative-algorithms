      ctx.scale(2,2);
      renderMiniAsset(ctx, rect.w, rect.h);
      el.appendChild(canvas);
      mosaic.appendChild(el);
    }
  });
}

function renderMiniAsset(ctx, w, h){
  const s = state.asset;
  const cx = w/2, cy = h/2, dw = w*0.8, dh = h*0.85;
  const g = diamondGeometry(cx, cy, dw, dh);

  ctx.save();
  traceDiamondUnion(ctx, g);
  ctx.clip();
  const lowerRatio = 0.55;
  let ls = seedFromString("miniasset"+seed);
  function localRand(){ ls = (ls*9301+49297)%233280; return ls/233280; }
  const n = Math.min(120, Math.max(30, state.comp.amount*3));
  for(let i=0;i<n;i++){
    const inLower = localRand() < lowerRatio;
    let r1 = localRand(), r2 = localRand();
    if(r1+r2>1){ r1=1-r1; r2=1-r2; }
    let p1;
    if(inLower){
      p1 = g.bottom;
    } else {
      p1 = g.top;
      r1=Math.pow(r1,1.7); r2=Math.pow(r2,1.7); if(r1+r2>1){const t=r1;r1=1-r2;r2=1-t;}
    }
    const x = p1.x + r1*(g.left.x-p1.x) + r2*(g.right.x-p1.x);
    const y = p1.y + r1*(g.left.y-p1.y) + r2*(g.right.y-p1.y);
    ctx.beginPath();
    ctx.fillStyle = s.shapeColor;
    ctx.arc(x,y, s.size*0.35*(inLower?1.2:0.9), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  drawDiamondArt(ctx, g, "#FFFFFF");
}

/* ============================================================
   LIVE ETHEREUM DATA — FETCH LAYER
   All 5 sources are fetched in parallel via Promise.allSettled so one
   failing endpoint never blocks the others. Each request is capped at
   10s via AbortController; a failed/timed-out source falls back to a
   simulated value and is flagged "sim" in liveData.sources.
   Note: only the 'Accept' header is sent (not 'Content-Type') — adding
   Content-Type to a GET request turns it into a non-simple CORS request
   requiring an OPTIONS preflight that these public endpoints don't serve,
   which would break the fetch entirely.
============================================================ */
function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  return fetch(url, {signal:controller.signal, headers:{"Accept":"application/json"}})
    .finally(()=>clearTimeout(timer));
}

async function fetchPrice(){
  const res = await fetchWithTimeout("https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd", 10000);
  if(!res.ok) throw new Error("price fetch failed");
  const data = await res.json();
  return data.ethereum.usd;
}
async function fetchTVL(){
  const res = await fetchWithTimeout("https://api.llama.fi/v2/chains", 10000);
  if(!res.ok) throw new Error("tvl fetch failed");
  const data = await res.json();
  const eth = data.find(c=>c.name === "Ethereum");
  if(!eth) throw new Error("ethereum chain not found");
  return eth.tvl;
}
async function fetchValidators(){
  const res = await fetchWithTimeout("https://beaconcha.in/api/v1/epoch/latest", 10000);
  if(!res.ok) throw new Error("validators fetch failed");
  const json = await res.json();
  return json.data.validatorcount;
}
async function fetchGas(){
  const res = await fetchWithTimeout("https://api.etherscan.io/api?module=gastracker&action=gasoracle", 10000);
  if(!res.ok) throw new Error("gas fetch failed");
  const json = await res.json();
  if(!json.result || !json.result.ProposeGasPrice) throw new Error("bad gas payload");
  return parseFloat(json.result.ProposeGasPrice);
}
async function fetchDapps(){
  const res = await fetchWithTimeout("https://api.llama.fi/protocols", 10000);
  if(!res.ok) throw new Error("protocols fetch failed");
  const json = await res.json();
  return json.length;
}

const LIVE_CACHE_KEY = "eth-brand-gen-live-cache";
const LIVE_CACHE_TTL = 60000;
function readLiveCache(){
  try{
    const raw = sessionStorage.getItem(LIVE_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(Date.now() - parsed.timestamp > LIVE_CACHE_TTL) return null;
    return parsed;
  }catch(e){ return null; }
}
function writeLiveCache(data){
  try{ sessionStorage.setItem(LIVE_CACHE_KEY, JSON.stringify(data)); }catch(e){}
}

async function fetchEthereumData(force){
  if(!force){
    const cached = readLiveCache();
    if(cached){ applyLiveData(cached, false); return cached; }
  }
  setLiveLoadingUI(true);
  const results = await Promise.allSettled([fetchPrice(), fetchTVL(), fetchValidators(), fetchGas(), fetchDapps()]);
  const [priceR, tvlR, validatorsR, gasR, dappsR] = results;
  const next = {
    price: priceR.status==="fulfilled" ? priceR.value : SIM_DEFAULTS.price,
    tvl: tvlR.status==="fulfilled" ? tvlR.value : SIM_DEFAULTS.tvl,
    validators: validatorsR.status==="fulfilled" ? validatorsR.value : SIM_DEFAULTS.validators,
    gas: gasR.status==="fulfilled" ? gasR.value : SIM_DEFAULTS.gas,
    dapps: dappsR.status==="fulfilled" ? dappsR.value : SIM_DEFAULTS.dapps,
    sources: {
      price: priceR.status==="fulfilled" ? "live" : "sim",
      tvl: tvlR.status==="fulfilled" ? "live" : "sim",
      validators: validatorsR.status==="fulfilled" ? "live" : "sim",
      gas: gasR.status==="fulfilled" ? "live" : "sim",
      dapps: dappsR.status==="fulfilled" ? "live" : "sim"
    },
    timestamp: Date.now()
  };
  const allFailed = results.every(r=>r.status==="rejected");
  writeLiveCache(next);
  applyLiveData(next, true);
  setLiveLoadingUI(false);
  showLiveFallback(allFailed);
  return next;
}

function applyLiveData(next, tween){
  const prevSnapshot = {price:liveData.price, tvl:liveData.tvl, validators:liveData.validators, gas:liveData.gas, dapps:liveData.dapps};
  liveData = Object.assign({}, next, {prev: prevSnapshot});
  renderLivePanel();
  mapLiveDataToAsset(tween);
}

function setLiveLoadingUI(loading){
  if(loading){
    document.querySelectorAll(".live-metric-value").forEach(el=>{
      el.innerHTML = '<span class="skeleton"></span>';
    });
  }
}
function showLiveFallback(show){
  const el = document.getElementById("liveFallback");
  if(el) el.style.display = show ? "block" : "none";
}

function renderLivePanel(){
  if(liveData.price == null) return;
  const arrow = (cur, prev)=>{
    if(prev == null || cur === prev) return "";
    const up = cur > prev;
    return `<span class="live-change ${up?"up":"down"}">${up?"▲":"▼"}</span>`;
  };
  const setMetric = (key, html)=>{ const el=document.querySelector(`[data-metric="${key}"]`); if(el) el.innerHTML = html; };
  const setDot = (key, live)=>{ const el=document.querySelector(`[data-dot="${key}"]`); if(el) el.classList.toggle("live", live); };

  setMetric("price", `$${Math.round(liveData.price).toLocaleString()} ${arrow(liveData.price, liveData.prev.price)}`);
  setMetric("tvl", `$${(liveData.tvl/1e9).toFixed(1)}B ${arrow(liveData.tvl, liveData.prev.tvl)}`);
  setMetric("validators", `${(liveData.validators/1e6).toFixed(2)}M ${arrow(liveData.validators, liveData.prev.validators)}`);
  setMetric("gas", `${Math.round(liveData.gas)} Gwei ${arrow(liveData.gas, liveData.prev.gas)}`);
  setMetric("dapps", `${liveData.dapps.toLocaleString()} ${arrow(liveData.dapps, liveData.prev.dapps)}`);

  setDot("price", liveData.sources.price === "live");
  setDot("tvl", liveData.sources.tvl === "live");
  setDot("validators", liveData.sources.validators === "live");
  setDot("gas", liveData.sources.gas === "live");
  setDot("dapps", liveData.sources.dapps === "live");

  const updatedEl = document.getElementById("liveUpdated");
  if(updatedEl) updatedEl.textContent = "Last updated: " + new Date(liveData.timestamp).toLocaleTimeString();

  updateLiveHeaderLabel();
}

// Collapsed header shows a live ticker of the primary metric when real-time
// tracking is on, so the key number is always visible without expanding.
function updateLiveHeaderLabel(){
  const labelEl = document.getElementById("livePanelLabel");
  const dotEl = document.getElementById("liveStatusDot");
  if(!labelEl || !dotEl) return;
  const panel = document.getElementById("livePanel");
  const collapsed = panel && !panel.classList.contains("expanded");
  const on = anyRealtimeOn();
  dotEl.classList.toggle("active", on);
  if(collapsed && on && liveData.price != null){
    labelEl.textContent = `ETH $${Math.round(liveData.price).toLocaleString()} —`;
  } else {
    labelEl.textContent = "Live Ethereum Data";
  }
}

/* ============================================================
   DATA-TO-VISUAL MAPPING + TWEEN
   Base associations: TVL->Amount, Validators->Size, dApps->Spacing,
   Gas->Speed, Price->intensity (opacity). The "Type of data" dropdown
   promotes one source to drive the headline parameter(s):
     dApps    -> dApp count becomes the primary Amount driver
     Staking  -> validator count drives Size (default association, made primary)
     TVL      -> TVL drives Amount AND Spacing
     Gas      -> Gas drives Speed AND Rotation
     ETH Price-> price drives overall intensity/opacity
     Mix      -> every source drives its association simultaneously, incl. Gas->Rotation
============================================================ */
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

function computeLiveTargets(){
  const amountTVL = clamp(liveData.tvl/1e9*5, 10, 500);
  const sizeVal = clamp(liveData.validators/1e6*10, 1, 20);
  const spacingDapps = clamp(50 - (liveData.dapps/3000)*49, 1, 50);
  const speedGas = clamp(0.1 + Math.max(0, liveData.gas-1)/99*(2.0-0.1), 0, 2);
  const rotationGas = (liveData.gas*3.6) % 360;
  const intensityPrice = clamp(liveData.price/5000, 0.3, 1);

  const targets = {amount:amountTVL, size:sizeVal, spacing:spacingDapps, speed:speedGas, priceIntensity:intensityPrice};
  const dt = state.dataType;
  if(dt === "dapps"){
    targets.amount = clamp(liveData.dapps/10, 10, 500);
  } else if(dt === "tvl"){
    targets.amount = amountTVL;
    targets.spacing = clamp(50 - amountTVL/500*49, 1, 50);
  } else if(dt === "gas"){
    targets.speed = speedGas;
    targets.rotation = rotationGas;
  } else if(dt === "mix"){
    targets.rotation = rotationGas;
  }
  return targets;
}

function syncAssetSliderUI(){
  ["amount","size","spacing","speed","rotation"].forEach(k=>{
    const el = document.querySelector(`[data-bind="asset.${k}"]`);
    const val = Math.round(state.asset[k]*100)/100;
    if(el) el.value = val;
    updateSliderLabel("asset."+k, val);
  });
}

// Blue glow (2s fade) on the sliders whose value just changed from a data-driven update.
function glowSliders(keys){
  keys.forEach(k=>{
    const el = document.querySelector(`[data-bind="asset.${k}"]`);
    if(!el) return;
    const control = el.closest(".control");
    if(!control) return;
    control.classList.remove("glow");
    void control.offsetWidth; // restart the CSS animation
    control.classList.add("glow");
  });
}

function tweenAssetTargets(targets, duration){
  const startVals = {};
  Object.keys(targets).forEach(k=>{ startVals[k] = state.asset[k]; });
  const t0 = performance.now();
  function step(now){
    const t = Math.min(1, (now - t0) / duration);
    Object.keys(targets).forEach(k=>{
      state.asset[k] = startVals[k] + (targets[k] - startVals[k]) * t;
    });
    syncAssetSliderUI();
    if(currentTab === "asset" && state.asset.animation === "none") renderAsset(0);
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// duration: 600ms for a direct "Type of data" selection (snappy, deliberate),
// 2000ms for the periodic real-time auto-refresh (gentler, ambient).
function mapLiveDataToAsset(shouldTween, duration){
  if(liveData.price == null) return;
  const targets = computeLiveTargets();
  glowSliders(Object.keys(targets).filter(k=>k !== "priceIntensity"));
  if(shouldTween){
    tweenAssetTargets(targets, duration || 2000);
  } else {
    Object.assign(state.asset, targets);
    syncAssetSliderUI();
    if(currentTab === "asset") renderAsset(0);
  }
}

/* ============================================================
   REAL-TIME TRACKING ENGINE
   "Real-time tracking: Yes" is a single shared toggle driving a 60s poll.
============================================================ */
function anyRealtimeOn(){
  return state.realtime === "yes";
}
function updateCountdownUI(){
  const el = document.getElementById("liveCountdown");
  if(el) el.textContent = anyRealtimeOn() ? `Next update in: ${countdownRemaining}s` : "";
}
function updateRealtimeEngine(){
  const on = anyRealtimeOn();
  const badge = document.getElementById("liveBadge");
  if(badge){
    badge.classList.toggle("active", on);
    badge.innerHTML = on
      ? '<span class="live-status-dot active"></span>LIVE'
      : '<span class="live-status-dot"></span>STATIC';
  }
  const stageDot = document.getElementById("canvasLiveDotStage");
  const compDot = document.getElementById("canvasLiveDotComp");
  if(stageDot) stageDot.classList.toggle("active", on);
  if(compDot) compDot.classList.toggle("active", on);
  updateLiveHeaderLabel();
  if(on && !realtimeIntervalId){
    fetchEthereumData(true);
    countdownRemaining = 60;
    updateCountdownUI();
    realtimeIntervalId = setInterval(()=>{ fetchEthereumData(true); countdownRemaining = 60; }, 60000);
    countdownIntervalId = setInterval(()=>{ countdownRemaining = Math.max(0, countdownRemaining-1); updateCountdownUI(); }, 1000);
  } else if(!on && realtimeIntervalId){
    clearInterval(realtimeIntervalId); realtimeIntervalId = null;
    clearInterval(countdownIntervalId); countdownIntervalId = null;
    updateCountdownUI();
  }
}

/* ============================================================
   SEED SYSTEM — encodes/restores the full control state as base64 JSON
============================================================ */
function encodeSeedFull(){
  return btoa(JSON.stringify(state));
}
function shortSeedFromFull(b64){
  const clean = b64.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
  return "ETH-" + clean.slice(0, 8);
}
function updateSeedDisplay(){
  const full = encodeSeedFull();
  const el = document.getElementById("seedDisplay");
  if(!el) return;
  el.textContent = shortSeedFromFull(full);
  el.dataset.full = full;
}
function flashButton(btn, text, revertMs){
  const original = btn.textContent;
  btn.textContent = text;
  setTimeout(()=>{ btn.textContent = original; }, revertMs || 1200);
}
function copySeed(btn){
  const full = document.getElementById("seedDisplay").dataset.full || encodeSeedFull();
  navigator.clipboard.writeText(full).then(()=>flashButton(btn, "Copied!")).catch(()=>{});
}
function copySeedLink(btn){
  const full = document.getElementById("seedDisplay").dataset.full || encodeSeedFull();
  const url = `${location.origin}${location.pathname}?seed=${encodeURIComponent(full)}`;
  navigator.clipboard.writeText(url).then(()=>flashButton(btn, "Copied!")).catch(()=>{});
}
function loadSeed(b64){
  try{
    const parsed = JSON.parse(atob(b64));
    const merged = JSON.parse(JSON.stringify(defaults));
    ["asset","icons","comp"].forEach(k=>{ merged[k] = Object.assign({}, defaults[k], parsed[k]||{}); });
    if(parsed.dataType !== undefined) merged.dataType = parsed.dataType;
    if(parsed.realtime !== undefined) merged.realtime = parsed.realtime;
    state = merged;
    syncUIFromState();
    updateSeedDisplay();
    render();
  }catch(e){
    console.warn("Invalid seed:", e);
  }
}

/* ============================================================
   PREVIEW BACKGROUND (UI-only — never affects the exported alpha)
============================================================ */
function updateStageBackground(){
  const tabState = state[currentTab];
  if(!tabState) return;
  const val = tabState.previewBg || "black";
  const target = currentTab === "composition"
    ? document.getElementById("compositionWrap")
    : document.querySelector(".stage");
  target.classList.remove("bg-black","bg-white","bg-checkerboard");
  if(val === "black") target.classList.add("bg-black");
  else if(val === "white") target.classList.add("bg-white");
  else target.classList.add("bg-checkerboard");
}

/* ============================================================
   RENDER DISPATCH
============================================================ */
function render(){
  updateStageBackground();
  updateRealtimeEngine();
  updateSeedDisplay();
  if(currentTab === "asset"){
    stopAnimation();
    if(state.asset.animation !== "none"){
      startAssetAnimation();
    } else {
      renderAsset(0);
    }
  } else if(currentTab === "icons"){
    renderIcons();
  } else if(currentTab === "composition"){
    buildMosaic();
  }
}

/* ============================================================
   EXPORT — PNG at 1x/2x/4x, SVG, and CSS custom properties
============================================================ */
function downloadCanvasPNG(canvas, filename){
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }, "image/png");
}
function downloadTextFile(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function buildCompositionCanvas(scale){
  const mosaic = document.getElementById("mosaicGrid");
  const rect = mosaic.getBoundingClientRect();
  const canvas = document.createElement("canvas");
  canvas.width = rect.width * scale;
  canvas.height = rect.height * scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(scale, scale);
  // Export always preserves transparency — the preview background is UI-only.
  Array.from(mosaic.children).forEach(child=>{
    const cRect = child.getBoundingClientRect();
    const x = cRect.left - rect.left;
    const y = cRect.top - rect.top;
    if(child.classList.contains("pill")){
      ctx.strokeStyle = state.comp.elColor;
      ctx.lineWidth = 1.5;
      roundRect(ctx, x, y, cRect.width, cRect.height, cRect.height/2);
      ctx.stroke();
      ctx.fillStyle = state.comp.elColor;
      ctx.font = "14px 'Space Grotesk', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(child.textContent, x + cRect.width/2, y + cRect.height/2);
    } else {
      const innerCanvas = child.querySelector("canvas");
      if(innerCanvas){
        ctx.drawImage(innerCanvas, x, y, cRect.width, cRect.height);
      }
    }
  });
  return canvas;
}
function downloadComposition(scale){
  const canvas = buildCompositionCanvas(scale || 2);
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `eth-composition-${scale||2}x.png`;
    a.click();
    URL.revokeObjectURL(url);
  }, "image/png");
}

function exportPNG(scale){
  if(currentTab === "asset"){
    const temp = document.createElement("canvas");
    temp.width = 640*scale; temp.height = 640*scale;
    const tctx = temp.getContext("2d");
    tctx.scale(scale, scale);
    drawAssetScene(tctx, 640, 640, lastAssetTime);
    downloadCanvasPNG(temp, `eth-asset-${scale}x.png`);
  } else if(currentTab === "icons"){
    const temp = document.createElement("canvas");
    temp.width = 640*scale; temp.height = 640*scale;
    const tctx = temp.getContext("2d");
    tctx.scale(scale, scale);
    drawIconsScene(tctx, 640, 640);
    downloadCanvasPNG(temp, `eth-icons-${scale}x.png`);
  } else if(currentTab === "composition"){
    downloadComposition(scale);
  }
}

function shapeToSVGElement(type, x, y, size, rotation, color){
  const transform = `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rotation.toFixed(1)})`;
  switch(type){
    case "dots": return `<circle cx="0" cy="0" r="${(size/2).toFixed(2)}" fill="${color}" transform="${transform}"/>`;
    case "circles": return `<circle cx="0" cy="0" r="${(size/2).toFixed(2)}" fill="none" stroke="${color}" stroke-width="1.2" transform="${transform}"/>`;
    case "squares": return `<rect x="${(-size/2).toFixed(2)}" y="${(-size/2).toFixed(2)}" width="${size.toFixed(2)}" height="${size.toFixed(2)}" fill="none" stroke="${color}" stroke-width="1.2" transform="${transform}"/>`;
    case "lines": return `<line x1="${(-size).toFixed(2)}" y1="0" x2="${size.toFixed(2)}" y2="0" stroke="${color}" stroke-width="1.2" transform="${transform}"/>`;
    case "triangles": return `<polygon points="0,${(-size/1.5).toFixed(2)} ${(size/1.5).toFixed(2)},${(size/2).toFixed(2)} ${(-size/1.5).toFixed(2)},${(size/2).toFixed(2)}" fill="none" stroke="${color}" stroke-width="1.2" transform="${transform}"/>`;
    case "cross": return `<g transform="${transform}"><line x1="${(-size/2).toFixed(2)}" y1="0" x2="${(size/2).toFixed(2)}" y2="0" stroke="${color}" stroke-width="1.2"/><line x1="0" y1="${(-size/2).toFixed(2)}" x2="0" y2="${(size/2).toFixed(2)}" stroke="${color}" stroke-width="1.2"/></g>`;
    default: return "";
  }
}

// True vector reconstruction for the Asset tab (we have structured particle
// geometry to work with). Icons/Composition fall back to a canvas-embedded
// <image> inside a valid SVG wrapper — still a real .svg file, just raster inside.
function assetToSVGString(){
  const s = state.asset;
  const cssW = 640, cssH = 640;
  const cx = cssW/2, cy = cssH/2, w = ASSET_DIAMOND.w, h = ASSET_DIAMOND.h;
  const g = diamondGeometry(cx, cy, w, h);
  const particles = particleCache.asset || buildAssetParticles();
  let shapesSVG = "";
  particles.forEach((pt)=>{
    const x = pt.x - ASSET_DIAMOND.cx + cx;
    const y = pt.y - ASSET_DIAMOND.cy + cy;
    const shapeType = s.shape === "mixed" ? pt.shapeVariant : s.shape;
    shapesSVG += shapeToSVGElement(shapeType, x, y, pt.baseSize, s.rotation, s.shapeColor);
  });
  const clipD = `M ${g.top.x} ${g.top.y} L ${g.right.x} ${g.right.y} L ${g.bottom.x} ${g.bottom.y} L ${g.left.x} ${g.left.y} Z`;
  const upperD = `M ${g.top.x} ${g.top.y} L ${g.right.x} ${g.right.y} L ${g.left.x} ${g.left.y} Z`;
  const lowerD = `M ${g.left.x} ${g.left.y} L ${g.right.x} ${g.right.y} L ${g.bottom.x} ${g.bottom.y} Z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${cssW} ${cssH}" width="${cssW}" height="${cssH}">
<defs><clipPath id="diamondClip"><path d="${clipD}"/></clipPath></defs>
<g clip-path="url(#diamondClip)">${shapesSVG}</g>
<path d="${upperD}" fill="rgba(255,255,255,0.02)" stroke="#FFFFFF" stroke-width="1.5"/>
<path d="${lowerD}" fill="rgba(255,255,255,0.04)" stroke="#FFFFFF" stroke-width="1.5"/>
<line x1="${g.left.x}" y1="${g.left.y}" x2="${g.right.x}" y2="${g.right.y}" stroke="#FFFFFF" stroke-width="0.8"/>
<line x1="${g.top.x}" y1="${g.top.y}" x2="${g.bottom.x}" y2="${g.bottom.y}" stroke="#FFFFFF" stroke-width="0.8"/>
</svg>`;
}

function exportSVG(){
  if(currentTab === "asset"){
    downloadTextFile(assetToSVGString(), "eth-asset.svg", "image/svg+xml");
  } else if(currentTab === "icons"){
    const dataUrl = iconsCanvas.toDataURL("image/png");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640"><image href="${dataUrl}" width="640" height="640"/></svg>`;
    downloadTextFile(svg, "eth-icons.svg", "image/svg+xml");
  } else if(currentTab === "composition"){
    const canvas = buildCompositionCanvas(2);
    const dataUrl = canvas.toDataURL("image/png");
    const w = canvas.width/2, h = canvas.height/2;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><image href="${dataUrl}" width="${w}" height="${h}"/></svg>`;
    downloadTextFile(svg, "eth-composition.svg", "image/svg+xml");
  }
}

function exportCSSVars(btn){
  let vars;
  if(currentTab === "asset"){
    const s = state.asset;
    vars = `:root {\n  --eth-shape-color: ${s.shapeColor};\n  --eth-dot-count: ${s.amount};\n  --eth-dot-size: ${s.size};\n  --eth-spacing: ${s.spacing};\n  --eth-rotation: ${s.rotation}deg;\n  --eth-animation: "${s.animation}";\n  --eth-animation-speed: ${s.speed};\n  --eth-flow: ${s.flow};\n  --eth-shape-type: "${s.shape}";\n  --eth-price-intensity: ${s.priceIntensity};\n}`;
  } else if(currentTab === "icons"){
    const s = state.icons;
    vars = `:root {\n  --eth-icon-inner-color: ${s.innerColor};\n  --eth-icon-outer-color: ${s.outerColor};\n  --eth-icon-amount: ${s.amount};\n  --eth-icon-spacing: ${s.spacing};\n  --eth-icon-rotation: ${s.rotation}deg;\n  --eth-icon-thickness: ${s.thickness};\n  --eth-icon-shape: "${s.shape}";\n  --eth-icon-style: "${s.style}";\n}`;
  } else {
    const s = state.comp;
    vars = `:root {\n  --eth-elements-color: ${s.elColor};\n  --eth-elements-amount: ${s.amount};\n  --eth-elements-spacing: ${s.spacing};\n  --eth-elements-rotation: ${s.rotation}deg;\n  --eth-elements-style: "${s.elStyle}";\n}`;
  }
  navigator.clipboard.writeText(vars).then(()=>{ if(btn) flashButton(btn, "Copied!"); }).catch(()=>{});
}

function handleExport(type, btn){
  if(type === "png1") exportPNG(1);
  else if(type === "png2") exportPNG(2);
  else if(type === "png4") exportPNG(4);
  else if(type === "svg") exportSVG();
  else if(type === "css") exportCSSVars(btn);
}

/* ============================================================
   INIT
============================================================ */
function init(){
  initBindings();
  const urlSeed = new URLSearchParams(location.search).get("seed");
  if(urlSeed){
    loadSeed(urlSeed);
  } else {
    syncUIFromState();
  }
  render();
  fetchEthereumData(false);
}

document.addEventListener("DOMContentLoaded", init);

window.addEventListener("resize", ()=>{
  if(currentTab === "icons") renderIcons();
  if(currentTab === "asset" && state.asset.animation === "none") renderAsset(0);
});

})();
</script>
